[project]
name = "sra-transcriptome-crawler"
version = "0.1.0"
description = "Batch crawler for Lepidoptera transcriptome metadata from NCBI SRA and BioSample."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2.0",
    "requests>=2.32.0",
]

[project.scripts]
sra-transcriptome-crawler = "sra_transcriptome_crawler:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
